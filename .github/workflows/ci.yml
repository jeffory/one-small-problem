# Builds the single-file game and runs every test suite. Three jobs run in parallel:
#   build  - unit tests, then the release build (which fails over the 131,072-byte cap); uploads the playable dist/index.html
#   soak   - 1000 generated seeds checked, and the immortal bot playing 60 seeds through both levels to boarding
#   smoke  - Playwright in Chromium (SwiftShader WebGL) and Firefox against the release build
# On main only, deploy then publishes the build job's index.html to GitHub Pages once all three have passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Release build (fails over 131,072 bytes)
        run: |
          npm run build
          bytes=$(stat -c %s dist/index.html)
          echo "dist/index.html: **$bytes bytes** ($((bytes * 100 / 131072))% of the 131,072-byte cap)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the playable page
        uses: actions/upload-artifact@v7
        with:
          path: dist/index.html
          archive: false
          if-no-files-found: error
      # Only the release page goes to Pages (dist/ can also hold the unminified dev.html)
      - name: Stage the page for GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: mkdir -p _site && cp dist/index.html _site/
      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  soak:
    name: Seed and bot soaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:seeds
      - run: npm run test:bot

  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      # Firefox's AudioContext only reaches 'running' with an audio device (the runner has none): give it a silent null sink
      - name: Silent PulseAudio sink
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dummy
          pactl set-default-sink dummy
      # xvfb-run: headless Firefox gets no WebGL2 on a GPU-less runner; playwright.config.mjs runs it headed on CI, which needs a display
      - run: xvfb-run -a npm run test:smoke
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Publishes https://jeffory.github.io/one-small-problem/ from the build job's artifact, and only once every suite has passed on the
  # same commit. A newer push to main cancels this run like any other; that push's own run deploys once its tests pass.
  deploy:
    name: Deploy to GitHub Pages
    needs: [build, soak, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
